spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/tracking_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.external.url=${API_EXTERNAL_URL:https://desafio-media.onrender.com}
api.external.key=${API_EXTERNAL_KEY:m4a_9d7f2c1ab84e6f03b2c91d5aa77e4c6f8b1d2e3f4a5b6c7}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
resilience4j.circuitbreaker.instances.gpsApi.sliding-window-size=10
resilience4j.circuitbreaker.instances.gpsApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gpsApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gpsApi.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gpsApi.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gpsApi.register-health-indicator=true

resilience4j.retry.instances.gpsApi.max-attempts=3
resilience4j.retry.instances.gpsApi.wait-duration=2s
resilience4j.retry.instances.gpsApi.retry-exceptions=org.springframework.web.reactive.function.client.WebClientResponseException

management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always